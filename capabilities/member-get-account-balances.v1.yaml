schemaVersion: "1.0"
capability:
  id: member.get-account-balances
  version: 1.0.0
  name: Get account balances
  description: Look up a synthetic member and return every available account balance.
  status: draft
targetApplication:
  vendor: heritage-core
  application: Heritage Core Servicing
  supportedVersions:
    - demo
  fingerprint:
    titlePatterns:
      - Heritage Core Servicing
    routePatterns:
      - /servicing/*
    landmarks:
      - Member Search
      - Accounts
inputs:
  memberId:
    type: string
    required: true
    sensitive: true
    description: Synthetic member number.
    pattern: ^[0-9]{5}$
outputs:
  accountBalances:
    type: accountBalances
    required: true
    description: Available account balances for the member.
outcomes:
  - code: MEMBER_NOT_FOUND
    description: No member exists for the supplied member number.
    when:
      - type: text_present
        value: Member not found
steps:
  - id: navigate-to-search
    action: navigate
    value:
      literal: "{{origin}}/servicing/search{{scenarioQuery}}"
    wait:
      type: navigation
      timeoutMs: 5000
    postcondition:
      - type: text_present
        value: Member Search
    recovery:
      retries:
        maxAttempts: 1
        backoffMs: 250
      knownDialogs:
        - title: System Notice
          response: dismiss
  - id: enter-member-id
    action: fill
    target:
      description: Member Number input
      primary:
        strategy: label
        text: Member Number
      fallbacks:
        - strategy: accessible
          role: textbox
          name: Member Number
    value:
      parameter: memberId
  - id: search-member
    action: click
    target:
      description: Search button in the member search form
      primary:
        strategy: relative
        anchorText: Member Number
        direction: below
        controlType: submit button
      fallbacks:
        - strategy: accessible
          role: button
          name: Search
    wait:
      type: text
      text: Accounts
      timeoutMs: 5000
    recovery:
      retries:
        maxAttempts: 1
        backoffMs: 250
  - id: extract-account-balances
    action: extract
    target:
      description: Accounts table with all available balances
      primary:
        strategy: structural
        description: Full Accounts table containing account type, account number, and balance columns
        columnText: Balance
    output:
      name: accountBalances
      parseAs: accountBalances
checkpoint:
  description: Account balances were extracted from the member account table.
  conditions:
    - type: output_present
      output: accountBalances
policy:
  allowedOrigins:
    - "{{origin}}"
    - http://localhost:3000
  allowedRoutes:
    - /servicing/*
  allowedActions:
    - navigate
    - click
    - fill
    - select
    - extract
    - wait
  risk: READ_ONLY
validation:
  runs: 5
  successes: 5
  failures: 0
  primaryLocatorUsage: 1
  fallbackLocatorUsage: 0
  lastValidatedAt: 2026-09-06T01:07:42.796Z
