schemaVersion: "1.0"
capability:
  id: member.deposit-to-account
  version: 1.0.0
  name: Deposit to account
  description: Deposit funds into a selected synthetic member account number after human approval.
  status: draft
targetApplication:
  vendor: heritage-core
  application: Heritage Core Servicing
  supportedVersions:
    - demo
  fingerprint:
    titlePatterns:
      - Heritage Core Servicing
    routePatterns:
      - /servicing/*
    landmarks:
      - Member Search
      - Accounts
inputs:
  memberId:
    type: string
    required: true
    sensitive: true
    description: Synthetic member number.
    pattern: ^[0-9]{5}$
  accountNumber:
    type: string
    required: true
    sensitive: true
    description: Exact account number to deposit into.
    pattern: ^[A-Z]-[0-9]{6}$
  amount:
    type: string
    required: true
    description: Positive dollar amount to deposit.
    pattern: ^[0-9]+(\.[0-9]{1,2})?$
outputs:
  newBalance:
    type: money
    required: true
    description: Account balance after the deposit is confirmed.
outcomes:
  - code: MEMBER_NOT_FOUND
    description: No member exists for the supplied member number.
    when:
      - type: text_present
        value: Member not found
  - code: ACCOUNT_NOT_FOUND
    description: The requested account number does not exist for the member.
    when:
      - type: text_present
        value: Account not found
  - code: INVALID_AMOUNT
    description: The supplied amount is not a valid positive dollar amount.
    when:
      - type: text_present
        value: Invalid amount
steps:
  - id: navigate-to-search
    action: navigate
    value:
      literal: "{{origin}}/servicing/search{{scenarioQuery}}"
    wait:
      type: navigation
      timeoutMs: 5000
    postcondition:
      - type: text_present
        value: Member Search
  - id: enter-member-id
    action: fill
    target:
      description: Member Number input
      primary:
        strategy: label
        text: Member Number
      fallbacks:
        - strategy: accessible
          role: textbox
          name: Member Number
    value:
      parameter: memberId
  - id: search-member
    action: click
    target:
      description: Search button in the member search form
      primary:
        strategy: relative
        anchorText: Member Number
        direction: below
        controlType: submit button
    wait:
      type: text
      text: Accounts
      timeoutMs: 5000
  - id: open-deposit-screen
    action: click
    target:
      description: Deposit action in the requested account row
      primary:
        strategy: structural
        description: Accounts table row action for the requested account number
        rowText: "{{accountNumber}}"
        controlText: Deposit
    wait:
      type: text
      text: Deposit Funds
      timeoutMs: 5000
  - id: enter-deposit-amount
    action: fill
    target:
      description: Deposit amount input
      primary:
        strategy: label
        text: Amount
    value:
      parameter: amount
  - id: review-deposit
    action: click
    target:
      description: Continue to deposit review
      primary:
        strategy: relative
        anchorText: Amount
        direction: below
        controlType: submit button
    wait:
      type: text
      text: Deposit Review
      timeoutMs: 5000
  - id: confirm-deposit
    action: click
    target:
      description: Confirm Deposit button
      primary:
        strategy: accessible
        role: button
        name: Confirm Deposit
    risk: IRREVERSIBLE_WRITE
    wait:
      type: text
      text: Deposit Confirmation
      timeoutMs: 5000
  - id: extract-new-balance
    action: extract
    target:
      description: New balance from the deposit confirmation table
      primary:
        strategy: structural
        description: Confirmation table new balance value
        rowText: New Balance
        columnText: Value
    output:
      name: newBalance
      parseAs: money
checkpoint:
  description: Deposit completed and the resulting account balance was extracted.
  conditions:
    - type: output_present
      output: newBalance
policy:
  allowedOrigins:
    - "{{origin}}"
    - http://localhost:3000
  allowedRoutes:
    - /servicing/*
  allowedActions:
    - navigate
    - click
    - fill
    - extract
    - wait
  risk: REVERSIBLE_WRITE
  approvalRequired: true
validation:
  runs: 1
  successes: 1
  failures: 0
  primaryLocatorUsage: 1
  fallbackLocatorUsage: 0
  lastValidatedAt: 2026-09-07T18:24:40.911Z
